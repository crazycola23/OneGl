name: OpenAPI Generated Artifact Bootstrap

on:
  push:
    branches: [openapi-contract-hardening]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: openapi-contract-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate OpenAPI artifacts
        run: |
          npm run openapi:build
          npm run openapi:types

      - name: Commit generated artifacts when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- openapi.json generated/openapi.d.ts)" ]]; then
            echo "Generated OpenAPI artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json generated/openapi.d.ts
          git commit -m "chore(openapi): commit generated contract artifacts"
          git push origin HEAD:openapi-contract-hardening
