name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: onegl
          POSTGRES_DB: onegl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d onegl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration check
        env:
          DATABASE_URL: postgresql://postgres:onegl@127.0.0.1:5432/onegl_ci
        run: |
          npm run db:migrate
          npm run db:status

      - name: Service platform DB integration
        env:
          DATABASE_URL: postgresql://postgres:onegl@127.0.0.1:5432/onegl_ci
        run: node --test test/service-platform-db.test.mjs

      - name: Install test browser
        run: npx playwright-core install --with-deps chromium

      - name: Syntax check
        run: |
          find src tools test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results.log
          if-no-files-found: warn
          retention-days: 7
