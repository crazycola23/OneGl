name: OpenAPI Finalize Bootstrap

on:
  push:
    branches: [openapi-contract-hardening]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: openapi-contract-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate OpenAPI contract
        run: |
          npm run openapi:build
          npm run openapi:lint
          npm run openapi:types
          npm run openapi:typecheck
          node --test test/openapi-build.test.mjs test/openapi-contract-coverage.test.mjs test/openapi-patch-contract.test.mjs test/openapi-runtime-parity.test.mjs

      - name: Commit generated artifacts when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- openapi.json generated/openapi.d.ts)" ]]; then
            echo "Generated OpenAPI artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json generated/openapi.d.ts
          git commit -m "chore(openapi): refresh validated generated artifacts"
          git push origin HEAD:openapi-contract-hardening
