extends:
  - recommended

rules:
  operation-operationId: error
  spec-ref-siblings: error
  no-unused-components: error
  # Public liveness/readiness/spec endpoints legitimately have no 4xx response.
  # Protected /v1 error coverage is enforced by openapi-contract-coverage.test.mjs.
  operation-4xx-response: off
  info-license: error
